name: Video Downloader

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Video URL (YouTube/Facebook/Instagram)'
        required: true
        type: string
      format:
        description: 'Format (mp4/mp3)'
        required: true
        default: 'mp4'
        type: choice
        options:
          - mp4
          - mp3

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install yt-dlp and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          yt-dlp --version

      - name: Download video (MP4)
        if: ${{ github.event.inputs.format == 'mp4' }}
        run: |
          mkdir -p output
          yt-dlp -f "bv*+ba/b" --merge-output-format mp4 \
            -o "output/%(title)s.%(ext)s" \
            "${{ github.event.inputs.video_url }}"
          ls -lh output/

      - name: Download audio (MP3)
        if: ${{ github.event.inputs.format == 'mp3' }}
        run: |
          mkdir -p output
          yt-dlp -x --audio-format mp3 \
            -o "output/%(title)s.%(ext)s" \
            "${{ github.event.inputs.video_url }}"
          ls -lh output/

      - name: Upload file
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-file
          path: output/
          retention-days: 1
